name: PlatformIO

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Compile pump safety bench tests (no upload or execution)
        run: pio test -e grova_core_v1 -f test_pump_safety --without-uploading --without-testing

      - name: Run local grow lifecycle tests on host
        run: python tests/host/run_tests.py

      - name: Build firmware
        run: pio run -e grova_core_v1

      - name: Build Founder S3 diagnostic firmware
        run: pio run -e grova_founder_s3_bringup

      - name: Build Founder S3 application
        run: pio run -e grova_founder_s3

      - name: Test Founder device services and commands on host
        run: python tests/founder/run_tests.py

      - name: Check embedded web JavaScript
        run: python tests/founder/check_web.py
