name: PlatformIO

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install browser test dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Compile pump safety bench tests (no upload or execution)
        run: pio test -e grova_core_v1 -f test_pump_safety --without-uploading --without-testing

      - name: Run local grow lifecycle tests on host
        run: python tests/host/run_tests.py

      - name: Build firmware
        run: pio run -e grova_core_v1

      - name: Build Core S3 diagnostic firmware
        run: pio run -e grova_founder_s3_bringup

      - name: Build Core S3 application
        run: pio run -e grova_founder_s3

      - name: Test controller device services and commands on host
        run: |
          mkdir -p .cache/browser
          python tests/controller/run_tests.py --blank-output .cache/browser/blank.json

      - name: Check embedded web JavaScript
        run: python tests/controller/check_web.py

      - name: Run hardware-free browser acceptance suites
        run: npm run test:browser -- --blank .cache/browser/blank.json
