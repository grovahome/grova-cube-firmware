; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:grova_core_v1]
; Keep the frozen V1 line on the validated Arduino 2.x toolchain.
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_src_filter =
	+<*>
	-<bringup/>
build_flags =
	-D GROVA_BUILD_ENV=\"grova_core_v1\"
lib_deps = 
	adafruit/Adafruit SSD1306@^2.5.16
	adafruit/Adafruit GFX Library@^1.12.6
	adafruit/Adafruit BME280 Library@^2.3.0
	adafruit/Adafruit BMP280 Library@^2.6.8
	adafruit/Adafruit AHTX0@^2.0.5
	adafruit/Adafruit SHT4x Library@^1.0.5
	adafruit/Adafruit VEML7700 Library@^2.1.6
	adafruit/Adafruit LTR390 Library@^1.1.2
	sensirion/Sensirion I2C SCD4x@^1.1.0
	knolleary/PubSubClient@^2.8
upload_protocol = esptool

; Isolated diagnostic firmware. Does not compile V1 automation or read secrets.h.
[env:grova_founder_s3_bringup]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
monitor_speed = 115200
upload_speed = 460800
upload_protocol = esptool
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DGROVA_FOUNDER_BRINGUP=1
build_src_filter =
    -<*>
    +<bringup/>
lib_deps =
    adafruit/Adafruit SSD1306@2.5.17
    adafruit/Adafruit GFX Library@1.12.6
